<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico">
<title>Video-Photo-Backup.swf</title>
<style>
  :root{
    --bg-1:#0a0f1e; --bg-2:#111827; --bg-3:#0d1a2e;
    --gold:#c9a84c; --gold-bright:#e8c96a;
    --ink:#e2e8f0; --ink-dim:#94a3b8; --line:#334155;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; color:var(--ink);
    font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(160deg,var(--bg-1) 0%,var(--bg-2) 60%,var(--bg-3) 100%);
    padding:clamp(24px,5vw,64px) 20px 80px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  a{color:inherit;}
  h1{
    font-size:clamp(1.7rem,4vw,2.3rem);
    font-weight:600;letter-spacing:0.01em;margin:0 0 8px 0;
    text-wrap:balance;
  }
  .sub{color:var(--ink-dim);font-size:15px;margin:0 0 40px 0;max-width:60ch;line-height:1.55;}

  .stage{
    border:1px solid var(--line);border-radius:12px;overflow:hidden;
    background:#ccc;line-height:0;position:relative;aspect-ratio:700/450;
  }
  .stage ruffle-embed{display:block;width:100%;height:100%;position:absolute;inset:0;}
  .back{display:inline-block;margin-bottom:20px;}

</style>
</head>
<body>
<div class="wrap">
<script>window.RufflePlayer=window.RufflePlayer||{};window.RufflePlayer.config={autoplay:"on",unmuteOverlay:"hidden",splashScreen:false,preloader:false};</script><script src="https://unpkg.com/@ruffle-rs/ruffle"></script><a class="back" href="/">&larr; Back to Windows Home Server, 2007</a><h1>Video-Photo-Backup.swf</h1><div class="stage"><embed src="/Video-Photo-Backup.swf" width="700" height="450"></div>
</div>

<script>
(function(){
  var loc = "";
  function ping(){
    if (!navigator.sendBeacon) return;
    navigator.sendBeacon("https://papalanc.com/whs/hit?path=" + encodeURIComponent(location.pathname) + "&ref=" + encodeURIComponent(document.referrer || "") + "&loc=" + encodeURIComponent(loc) + "&t=" + Date.now());
  }
  fetch("https://get.geojs.io/v1/ip/geo.json")
    .then(function(r){ return r.json(); })
    .then(function(d){ loc = [d.city, d.region, d.country].filter(Boolean).join(", "); })
    .catch(function(){})
    .then(ping);
})();
</script>
</body>
</html>
